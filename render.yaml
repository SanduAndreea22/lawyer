services:
  - type: web
    name: cassian-voicu
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: cassian-voicu.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://cassian-voicu.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: DATABASE_URL
        sync: false
